[package]
name = "tidings"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aho-corasick = "1"
ammonia = "4"
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
fancy-regex = "0.14"
encoding_rs = "0.8"
mediatype = "0.21"
feed-rs = "2"
htmlize = { version = "1", features = ["unescape"] }
kuchikiki = "0.8"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
regex = "1"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde_json = "1"
signal-hook = "0.3"
ureq = { version = "3", features = ["charset", "gzip"] }
url = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
cxx-qt-build = "0.10.0"

[profile.release]
lto = "thin"
